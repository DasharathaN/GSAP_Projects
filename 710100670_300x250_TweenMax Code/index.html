<!doctype html>
<html>
	<head>
		<meta name="ad.size" content="width=300,height=250">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>Cherry add</title>
		<link href="main.css" rel="stylesheet" type="text/css">
		<script type="text/javascript">var clickTag = "https://www.google.com";</script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/latest/TweenMax.min.js" defer></script>
		<script type="text/javascript" src="main.js" defer></script>
	</head>
	<body onload="startAd()">
		<div id="container">
			<div id="content">
				<a href="javascript:void(0);" onClick="window.open(clickTag);">
					<div id="rolloverCatch"></div>
					<div id="cover"></div>
					
                     <!-- ✅ 1. Background goes first -->
					<div id="cover_bg" class="lgArt"><img src="images/bg.png" alt="bg"></div>

					<!-- ✅ 2. Car and other content -->
					<div id="txt1b" class="lgArt"><img src="images/txt1b.jpg" alt="car"></div>
					<div id="bg_top_layer" class="lgArt"><img src="images/bg_top.png" alt="bg_top_layer"></div>

					<!-- ✅ 3. Logo and other overlays -->
					<div id="txt1a" class="lgArt"><img src="images/txt1a.png" alt="logo"></div>
					<div id="txt2a" class="lgArt"><img src="images/txt2a.png" alt="Headline"></div>
					<div id="txt2b" class="lgArt"><img src="images/txt2b.png" alt="Price"></div>
					<div id="txt3a" class="lgArt"><img src="images/txt3a.png" alt="Badge"></div>
					<div id="txt4a" class="lgArt"><img src="images/txt4a.png" alt="Warranty"></div>
					<div id="txt5a" class="lgArt"><img src="images/txt5a.png" alt="ANCAP"></div>
					<div id="txt6a" class="lgArt"><img src="images/txt6a.png" alt="WHEELS"></div>
					<div id="txt7a" class="lgArt"><img src="images/txt7a.png" alt="Final Logo"></div>
                    <div id="CTA" class="lgArt"><img src="images/CTA.png" alt="CTA" /></div>
					
				</a>
			</div>
		</div>
	</body>
</html>
